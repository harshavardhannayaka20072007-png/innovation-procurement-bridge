{% extends "base.html" %}
{% block title %}Set New Password - Innovation Procurement Bridge{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card border-0 shadow-sm"><div class="card-body p-4">
  <h3 class="fw-bold">Enter your OTP</h3><p class="text-muted">The code expires after 10 minutes.</p>
  <form method="post" action="{{ url_for('auth.reset_password') }}"><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" type="email" name="email" required autocomplete="email"></div><div class="mb-3"><label class="form-label" for="otp">Six-digit OTP</label><input class="form-control" id="otp" type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="mb-3"><label class="form-label" for="password">New password</label><input class="form-control" id="password" type="password" name="password" minlength="12" maxlength="128" required autocomplete="new-password"></div><button class="btn btn-primary w-100" type="submit">Set new password</button></form>
</div></div></div></div></div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Reset Password - Innovation Procurement Bridge{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card border-0 shadow-sm"><div class="card-body p-4">
  <h3 class="fw-bold">Reset your password</h3><p class="text-muted">We will send a six-digit OTP to your registered email address.</p>
  <form method="post" action="{{ url_for('auth.forgot_password') }}"><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" type="email" name="email" required autocomplete="email"></div><button class="btn btn-primary w-100" type="submit">Send OTP</button></form>
  <p class="small text-center mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</div></div></div></div></div>
{% endblock %}

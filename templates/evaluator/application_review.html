<form method="POST" action="/scores/evaluator" class="eval-form">
    <input type="hidden" name="application_id" value="{{ application.application_id }}">
    
    <div class="form-group">
        <label for="eligibility_score">Eligibility Score (Max 20):</label>
        <input type="number" id="eligibility_score" name="eligibility_score" max="20" min="0" required>
    </div>
    <div class="form-group">
        <label for="technology_score">Technology Score (Max 20):</label>
        <input type="number" id="technology_score" name="technology_score" max="20" min="0" required>
    </div>
    <div class="form-group">
        <label for="feasibility_score">Feasibility Score (Max 20):</label>
        <input type="number" id="feasibility_score" name="feasibility_score" max="20" min="0" required>
    </div>
    <div class="form-group">
        <label for="timeline_score">Timeline Score (Max 20):</label>
        <input type="number" id="timeline_score" name="timeline_score" max="20" min="0" required>
    </div>
    <div class="form-group">
        <label for="experience_score">Experience Score (Max 20):</label>
        <input type="number" id="experience_score" name="experience_score" max="20" min="0" required>
    </div>

    <div class="btn-group">
        <button type="submit" class="btn-action">Submit Evaluation Score</button>
        <a href="/evaluator/dashboard" class="btn-action secondary">Cancel</a>
    </div>
</form>

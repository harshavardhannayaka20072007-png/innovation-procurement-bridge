{% extends "base.html" %} {% block title %}Post New Challenge - Innovation
Procurement Bridge{% endblock %} {% block content %}
<div class="container py-4">
  <div class="d-flex align-items-center mb-4">
    <a
      href="{{ url_for('government.dashboard') }}"
      class="btn btn-outline-secondary btn-sm me-3"
    >
      <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
    <h2 class="fw-bold mb-0">Post a New Problem Statement / Challenge</h2>
  </div>

  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">
      <form
        action="{{ url_for('government.create_challenge') }}"
        method="POST"
        enctype="multipart/form-data"
      >
        <div class="row g-3">
          <!-- Challenge Title -->
          <div class="col-12">
            <label for="title" class="form-label fw-semibold"
              >Challenge Title</label
            >
            <input
              type="text"
              class="form-control"
              id="title"
              name="title"
              placeholder="e.g., AI-based Urban Traffic Optimization System"
              required
            />
          </div>

          <!-- Department & Sector -->
          <div class="col-md-6">
            <label for="department" class="form-label fw-semibold"
              >Department / Ministry</label
            >
            <input
              type="text"
              class="form-control"
              id="department"
              name="department"
              placeholder="e.g., Smart Cities Mission / Transport Dept"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="sector" class="form-label fw-semibold"
              >Focus Sector</label
            >
            <select class="form-select" id="sector" name="sector" required>
              <option value="" selected disabled>Select Sector</option>
              <option value="Urban Mobility">Urban Mobility</option>
              <option value="Healthcare">Healthcare & Sanitation</option>
              <option value="Agriculture">Agriculture & Agritech</option>
              <option value="Clean Energy">
                Clean Energy & Sustainability
              </option>
              <option value="Governance">E-Governance & Security</option>
            </select>
          </div>

          <!-- Problem Description -->
          <div class="col-12">
            <label for="description" class="form-label fw-semibold"
              >Problem Statement Description</label
            >
            <textarea
              class="form-control"
              id="description"
              name="description"
              rows="5"
              placeholder="Describe the problem, current bottleneck, and expectations clearly..."
              required
            ></textarea>
          </div>

          <!-- Budget & Deadline -->
          <div class="col-md-6">
            <label for="budget" class="form-label fw-semibold"
              >Procurement / Pilot Budget (₹)</label
            >
            <input
              type="number"
              class="form-control"
              id="budget"
              name="budget"
              placeholder="e.g., 2500000"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="deadline" class="form-label fw-semibold"
              >Application Deadline</label
            >
            <input
              type="date"
              class="form-control"
              id="deadline"
              name="deadline"
              required
            />
          </div>

          <!-- Supporting Documents -->
          <div class="col-12">
            <label for="document" class="form-label fw-semibold"
              >Upload RFP / Guidelines Document (PDF)</label
            >
            <input
              class="form-control"
              type="file"
              id="document"
              name="document"
              accept=".pdf,.docx"
            />
          </div>

          <!-- Action Buttons -->
          <div class="col-12 d-flex justify-content-end gap-2 mt-4">
            <a
              href="{{ url_for('government.dashboard') }}"
              class="btn btn-light px-4"
              >Cancel</a
            >
            <button type="submit" class="btn btn-primary px-4">
              Publish Challenge
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

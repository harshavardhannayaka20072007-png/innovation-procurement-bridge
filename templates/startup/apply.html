{% extends "base.html" %} {% block title %}Submit Proposal{% endblock %} {%
block content %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/startup.css') }}"
/>

<div class="startup-container">
  <div class="card">
    <h2>Submit Proposal</h2>
    <p><strong>Challenge:</strong> {{ challenge.title }}</p>

    <form id="applicationForm">
      <input
        type="hidden"
        name="challenge_id"
        value="{{ challenge.challenge_id }}"
      />

      <div class="form-group">
        <label for="solution">Proposed Solution</label>
        <textarea
          id="solution"
          name="solution"
          rows="5"
          required
          placeholder="Describe your technical solution in detail..."
        ></textarea>
      </div>

      <div class="form-group">
        <label for="technology">Technology Stack</label>
        <input
          type="text"
          id="technology"
          name="technology"
          required
          placeholder="e.g. Python, React, PostgreSQL, Docker"
        />
      </div>

      <div class="form-group">
        <label for="timeline">Estimated Timeline</label>
        <input
          type="text"
          id="timeline"
          name="timeline"
          required
          placeholder="e.g. 30 days, 3 months"
        />
      </div>

      <div style="margin-top: 1.5rem">
        <button type="submit" class="btn">Submit Proposal</button>
        <a
          href="{{ url_for('startup.challenge_details', challenge_id=challenge.challenge_id) }}"
          class="btn btn-secondary"
          >Cancel</a
        >
      </div>
    </form>

    <div id="formResponse" style="margin-top: 1rem"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/startup.js') }}"></script>
{% endblock %}

{% extends "base.html" %} {% block title %}Startup Profile{% endblock %} {%
block content %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/startup.css') }}"
/>

<div class="startup-container">
  <div class="card">
    <h2>Startup Profile</h2>
    <p>
      Manage your official DPIIT registration details and startup information.
    </p>

    {% if message %}
    <div class="alert alert-success" style="margin-bottom: 1rem">
      {{ message }}
    </div>
    {% endif %}

    <form action="{{ url_for('startup.profile') }}" method="POST">
      <div class="form-group">
        <label for="startup_name">Startup Name</label>
        <input
          type="text"
          id="startup_name"
          name="startup_name"
          value="{{ profile.startup_name if profile else '' }}"
          required
          placeholder="e.g. Acme Innovations Tech"
        />
      </div>

      <div class="form-group">
        <label for="registration_number">DPIIT Registration Number</label>
        <input
          type="text"
          id="registration_number"
          name="registration_number"
          value="{{ profile.registration_number if profile else '' }}"
          required
          placeholder="e.g. DIPP12345"
        />
      </div>

      <div class="form-group">
        <label for="technology_domain">Core Technology / Domain</label>
        <input
          type="text"
          id="technology_domain"
          name="technology_domain"
          value="{{ profile.technology_domain if profile else '' }}"
          required
          placeholder="e.g. AI / Machine Learning, Cleantech"
        />
      </div>

      <div style="margin-top: 1.5rem">
        <button type="submit" class="btn">Save Profile</button>
        <a href="{{ url_for('startup.dashboard') }}" class="btn btn-secondary"
          >Back to Dashboard</a
        >
      </div>
    </form>
  </div>
</div>
{% endblock %}

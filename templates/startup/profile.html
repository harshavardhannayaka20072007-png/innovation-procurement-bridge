{% extends "base.html" %} {% block title %}Startup Profile{% endblock %} {%
block content %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/startup.css') }}"
/>

<div class="startup-container">
  <div class="card">
    <h2>Startup Profile</h2>
    <p>View and manage your registered startup details.</p>

    {% if message %}
    <div class="alert alert-success" style="margin-bottom: 1rem">
      {{ message }}
    </div>
    {% endif %} {% if error %}
    <div class="alert alert-danger" style="margin-bottom: 1rem">
      {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('startup.profile') }}" method="POST">
      <div class="form-group">
        <label for="startup_name">Startup Name</label>
        <input
          type="text"
          id="startup_name"
          name="startup_name"
          value="{{ profile.startup_name if profile and profile.startup_name else '' }}"
          placeholder="e.g. Acme Innovations Tech"
        />
      </div>

      <div class="form-group">
        <label for="registration_number">Registration Number</label>
        <input
          type="text"
          id="registration_number"
          name="registration_number"
          value="{{ profile.registration_number if profile and profile.registration_number else '' }}"
          placeholder="e.g. REG12345"
        />
      </div>

      <div class="form-group">
        <label for="technology_domain">Core Technology / Domain</label>
        <input
          type="text"
          id="technology_domain"
          name="technology_domain"
          value="{{ profile.technology_domain if profile and profile.technology_domain else '' }}"
          placeholder="e.g. CleanTech, AI/ML"
        />
      </div>

      <div style="margin-top: 1.5rem">
        <button type="submit" class="btn">Save Profile</button>
        <a href="{{ url_for('startup.dashboard') }}" class="btn btn-secondary"
          >Back to Dashboard</a
        >
      </div>
    </form>
  </div>
</div>
{% endblock %}
